[project]
name = "zcash-wallet-mcp"
version = "0.1.0"
description = "MCP server for a Zcash light wallet on this computer: addresses, balance, shielded addresses, sending ZEC, through zingo-cli"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp[cli]==2.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
zcash-wallet-mcp = "zcash_wallet_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zcash_wallet_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
