[project]
name = "analyst-mcp"
version = "0.1.0"
description = "MCP server for spreadsheet analysis: read workbooks, query them, preview tables and charts, export Excel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]==2.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "openpyxl>=3.1",
    "duckdb>=1.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "formulas>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
analyst-mcp = "analyst_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
