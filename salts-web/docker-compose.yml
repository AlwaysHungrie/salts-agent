# Self-hosted SearXNG: a metasearch engine that fronts Google, Bing, DuckDuckGo,
# Brave and friends and answers over a plain JSON API. Replaces the Brave API key.
#
# Driven by the salts-web CLI (see README), which supplies SALTS_TOKEN from the
# Keychain and SALTS_PORT from a free-port scan.

# `searxng` is kept from before the folder was renamed, so a stack already running is
# recreated in place rather than colliding with its own container names. salts-web
# sets `searxng-staging` for the staging instance, so the two can run side by side.
name: ${SALTS_PROJECT:-searxng}

services:
  # First-run setup. Generates the instance secret into settings.yml. Runs to
  # completion before SearXNG starts, and regenerates nothing on every later run.
  init:
    image: docker.io/library/alpine:3
    container_name: ${SALTS_PROJECT:-searxng}-init
    volumes:
      - ./:/config
    command:
      - sh
      - -c
      - |
        set -e
        rand() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }

        if grep -q 'secret_key: ""' /config/settings.yml; then
          # Rewrite in place (same inode) so the bind mount keeps working.
          sed "s|secret_key: \"\"|secret_key: \"$$(rand)\"|" /config/settings.yml > /tmp/s.yml
          cat /tmp/s.yml > /config/settings.yml
          echo "generated a new secret_key"
        else
          echo "secret_key already set"
        fi

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: ${SALTS_PROJECT:-searxng}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    # No host port: the token gate is the only way in. The unguarded override
    # file swaps that around (see README).
    expose:
      - "8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
      - ./limiter.toml:/etc/searxng/limiter.toml:rw
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8080/}
      - UWSGI_WORKERS=${UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${UWSGI_THREADS:-4}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  # The token gate, and the only way in. The agent sends
  # `Authorization: Bearer <token>`; only requests carrying it reach SearXNG.
  # Bound to loopback: ngrok is what takes it off the machine.
  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: ${SALTS_PROJECT:-searxng}-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SALTS_PORT:-8080}:8081"
    environment:
      - SALTS_TOKEN=${SALTS_TOKEN:?run salts-web start; it supplies the token from the Keychain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      init:
        condition: service_completed_successfully
      searxng:
        condition: service_started

volumes:
  caddy-data:
