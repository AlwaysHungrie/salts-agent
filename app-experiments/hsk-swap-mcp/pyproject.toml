[project]
name = "hsk-swap-mcp"
version = "0.1.0"
description = "MCP server: a wallet's HSKswap positions and P&L on HSK Chain, read live from the chain"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]==2.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "httpx>=0.27",
    "eth-abi>=5.1",
    "eth-utils>=5.1",
    "eth-hash[pycryptodome]>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
hsk-swap-mcp = "hsk_swap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsk_swap_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
